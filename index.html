<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="メモ+">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>メモ+</title>
<style>
/* Layout: iOS-style navigation stack (folders → list → note), each screen a full-height scroller with its own nav bar and bottom toolbar. */
:root{
  --bg:#f2f2f7; --cell:#ffffff; --paper:#ffffff; --label:#000000; --sec:#8a8a8e; --ter:#c4c4c7;
  --sep:#d1d1d6; --fill:rgba(118,118,128,.12); --accent:#d39e00; --danger:#ff3b30; --pin:#ff9500; --blue:#0a7aff;
  --nav:rgba(242,242,247,.86); --navpaper:rgba(255,255,255,.88); --dim:rgba(0,0,0,.35);
  --h0:#e8590c; --h1:#1c7ed6; --h2:#2f9e44; --h3:#d6336c; --h4:#7048e8; --h5:#c99700; --h6:#0c8599; --h7:#868e96;
  --font:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#000000; --cell:#1c1c1e; --paper:#000000; --label:#ffffff; --sec:#8d8d93; --ter:#48484a;
  --sep:#38383a; --fill:rgba(118,118,128,.24); --accent:#ffd60a; --danger:#ff453a; --pin:#ff9f0a; --blue:#0a84ff;
  --nav:rgba(18,18,18,.86); --navpaper:rgba(0,0,0,.86); --dim:rgba(0,0,0,.55);
  --h0:#ff8a4c; --h1:#5aa9ff; --h2:#5fd27a; --h3:#ff7aa8; --h4:#a891ff; --h5:#ffd43b; --h6:#3fd0e0; --h7:#adb5bd;
  color-scheme:dark}}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--label);font-family:var(--font);font-size:17px;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg{display:block}
#app{position:fixed;inset:0;overflow:hidden}

/* ---------- screens ---------- */
.screen{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;background:var(--bg);transition:transform .38s cubic-bezier(.2,.8,.2,1),filter .38s;will-change:transform;padding-bottom:calc(64px + env(safe-area-inset-bottom,0px))}
.screen.paper{background:var(--paper)}
.screen.enter{transform:translateX(100%)}
.screen.under{transform:translateX(-28%);filter:brightness(.92)}
.screen.dragging{transition:none}
@media (prefers-reduced-motion:reduce){.screen{transition:none}}

.nav{position:sticky;top:0;z-index:20;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top,0px) + 6px) 12px 6px;min-height:calc(env(safe-area-inset-top,0px) + 50px);background:var(--nav);-webkit-backdrop-filter:saturate(180%) blur(18px);backdrop-filter:saturate(180%) blur(18px);border-bottom:.5px solid transparent;transition:border-color .2s}
.paper .nav{background:var(--navpaper)}
.nav.scrolled{border-bottom-color:var(--sep)}
.nav .l{display:flex;justify-content:flex-start;min-width:0}
.nav .r{display:flex;justify-content:flex-end;gap:18px;align-items:center}
.nav .t{font-weight:600;font-size:17px;opacity:0;transition:opacity .2s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46vw}
.nav.scrolled .t{opacity:1}
.navbtn{color:var(--accent);display:inline-flex;align-items:center;gap:4px;font-size:17px;min-height:36px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.navbtn.bold{font-weight:600}
.navbtn svg{flex:none}

.big{font-size:34px;font-weight:700;letter-spacing:.01em;margin:2px 16px 10px;line-height:1.15;word-break:break-word}
.big.tagtitle{color:var(--tc)}
.search{margin:0 16px 14px;display:flex;align-items:center;gap:6px;background:var(--fill);border-radius:10px;padding:0 8px;height:36px;color:var(--sec)}
.search input{flex:1;min-width:0;border:0;background:none;outline:none;font-size:17px;color:var(--label);height:100%}
.search input::placeholder{color:var(--sec)}

.sechead{display:flex;align-items:center;justify-content:space-between;margin:22px 32px 6px;font-size:20px;font-weight:700}
.sechead.small{font-size:13px;font-weight:400;color:var(--sec);text-transform:uppercase;margin:18px 32px 6px}
.group{margin:0 16px;background:var(--cell);border-radius:10px;overflow:hidden}
.row{position:relative;display:flex;align-items:center;gap:12px;width:100%;min-height:44px;padding:10px 16px;text-align:left;background:var(--cell)}
.swipe + .swipe::before{content:"";position:absolute;top:0;left:20px;right:0;border-top:.5px solid var(--sep);z-index:1}
.row + .row::before{content:"";position:absolute;top:0;left:52px;right:0;border-top:.5px solid var(--sep);z-index:1}
.row .ic{color:var(--accent);flex:none;width:26px;display:flex;justify-content:center}
.row .lb{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .ct{color:var(--sec);font-variant-numeric:tabular-nums}
.row .chev{color:var(--ter)}
.row.today .lb{font-weight:600}
.row .del{color:var(--danger)}
.row:active{background:var(--fill)}

.tagcloud{display:flex;flex-wrap:wrap;gap:8px;margin:0 16px}
.chip{--tc:var(--h7);display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:6px 12px;font-size:15px;background:color-mix(in srgb,var(--tc) 16%,var(--cell));color:var(--label);border:1px solid color-mix(in srgb,var(--tc) 40%,transparent);white-space:nowrap}
.chip .dot{width:9px;height:9px;border-radius:50%;background:var(--tc);flex:none}
.chip .n{color:var(--sec);font-size:13px;font-variant-numeric:tabular-nums}
.chip.sm{padding:1px 8px;font-size:12px;gap:4px}
.chip.sm .dot{width:7px;height:7px}

/* note rows with swipe */
.swipe{position:relative;overflow:hidden;background:var(--danger)}
.swipe .acts{position:absolute;inset:0 0 0 auto;display:flex}
.swipe .acts button{width:72px;color:#fff;font-size:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.swipe .acts .a-pin{background:var(--pin)}
.swipe .acts .a-move{background:#5e5ce6}
.swipe .acts .a-del{background:var(--danger)}
.swipe .acts .a-restore{background:var(--blue)}
.nrow{position:relative;display:block;width:100%;text-align:left;background:var(--cell);padding:11px 16px 11px 20px;transition:transform .25s ease;touch-action:pan-y}
.nrow.drag{transition:none}
.nrow .tt{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:6px}
.nrow .tt .pinic{color:var(--pin);flex:none}
.nrow .sub{display:flex;gap:8px;color:var(--sec);font-size:15px;margin-top:1px;min-width:0}
.nrow .sub .d{flex:none;font-variant-numeric:tabular-nums;color:var(--label);opacity:.75}
.nrow .sub .p{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nrow .dots{display:flex;gap:4px;margin-top:5px;flex-wrap:wrap}
.nrow .fold{display:flex;align-items:center;gap:4px;color:var(--sec);font-size:13px;margin-top:3px}
.nrow:active{background:var(--fill)}
.swipe.flash .nrow{background:color-mix(in srgb,var(--accent) 20%,var(--cell))}

/* tag line rows */
.lrow{display:block;width:100%;text-align:left;background:var(--cell);padding:12px 16px 12px 18px;border-left:4px solid var(--tc,var(--h7));position:relative}
.lrow + .lrow{border-top:.5px solid var(--sep)}
.lrow .tx{white-space:pre-wrap;word-break:break-word}
.lrow .mt{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:6px;color:var(--sec);font-size:13px}
.lrow .mt .tm{font-variant-numeric:tabular-nums}
.lrow:active{background:var(--fill)}
.lrow .lock{display:inline-flex;align-items:center;gap:3px;color:var(--danger);font-size:12px;font-weight:600}
.lrow.selecting{padding-left:52px}
.lrow .cb{position:absolute;left:16px;top:50%;width:24px;height:24px;margin-top:-12px;border-radius:50%;border:1.5px solid var(--ter)}
.lrow.on .cb{background:var(--accent);border-color:var(--accent)}
.lrow.on .cb::after{content:"";position:absolute;left:7px;top:3px;width:6px;height:11px;border:solid var(--paper);border-width:0 2px 2px 0;transform:rotate(45deg)}
.tbar .ai{font-weight:600;font-size:16px;padding:0 4px;gap:4px}
.tbar .txtbtn{font-size:16px;padding:0 4px}
.panel .sub{font-size:13px;color:var(--sec);margin:10px 0 6px}
.chip .x{color:var(--sec);margin-left:2px;font-size:14px;line-height:1}
.daylabel{margin:18px 32px 6px;font-size:13px;color:var(--sec);font-weight:600}

.seg{display:flex;margin:0 16px 8px;background:var(--fill);border-radius:9px;padding:2px}
.seg button{flex:1;padding:6px 0;border-radius:7px;font-size:14px;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--cell);box-shadow:0 1px 3px rgba(0,0,0,.15)}

.empty{color:var(--sec);text-align:center;padding:48px 32px;line-height:1.7;font-size:15px}
.empty b{color:var(--label);display:block;font-size:20px;margin-bottom:6px}
.empty code{font-family:var(--font);background:var(--fill);border-radius:6px;padding:1px 6px;color:var(--label)}
.note{color:var(--sec);font-size:13px;margin:8px 32px 0;line-height:1.5}

/* bottom toolbar */
.tbar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:8px 18px calc(8px + env(safe-area-inset-bottom,0px));background:var(--nav);-webkit-backdrop-filter:saturate(180%) blur(18px);backdrop-filter:saturate(180%) blur(18px);border-top:.5px solid var(--sep);color:var(--accent)}
.paper .tbar{background:var(--navpaper)}
.tbar .mid{color:var(--label);font-size:12px}
.tbar button{min-width:36px;min-height:36px;display:flex;align-items:center;justify-content:center;color:var(--accent)}
.tbar button:disabled{color:var(--ter)}

/* editor */
.when{text-align:center;color:var(--sec);font-size:13px;margin:4px 0 6px}
.editor{min-height:60vh;padding:0 20px 40vh;outline:none;line-height:1.5;font-size:17px;word-break:break-word;caret-color:var(--accent)}
.editor > *{margin:0}
.editor > :first-child{font-size:28px;font-weight:700;line-height:1.25;margin-bottom:6px}
.editor h1{font-size:28px;font-weight:700;line-height:1.25}
.editor h2{font-size:22px;font-weight:700}
.editor h3{font-size:19px;font-weight:600}
.editor pre{font-family:var(--mono);font-size:15px;white-space:pre-wrap;background:var(--fill);border-radius:6px;padding:2px 6px}
.editor ul,.editor ol{padding-left:28px}
.editor ul.dash{list-style:none}
.editor ul.dash > li::before{content:"–";position:absolute;margin-left:-18px}
.editor img{max-width:100%;height:auto;border-radius:10px;display:block;margin:6px 0}
.editor a{color:var(--accent)}
.editor .tag{color:var(--tc,var(--accent));font-weight:600;background:color-mix(in srgb,var(--tc,var(--accent)) 14%,transparent);border-radius:5px;padding:0 2px}
.editor .tagged{box-shadow:inset 3px 0 0 var(--tc);padding-left:10px;margin-left:-13px;border-radius:2px}
.editor .ck{position:relative;padding-left:32px;min-height:1.5em}
.editor .ck::before{content:"";position:absolute;left:2px;top:.18em;width:20px;height:20px;border-radius:50%;border:1.5px solid var(--ter);box-sizing:border-box}
.editor .ck[data-done="1"]::before{background:var(--accent);border-color:var(--accent)}
.editor .ck[data-done="1"]::after{content:"";position:absolute;left:9px;top:calc(.18em + 4px);width:5px;height:10px;border:solid var(--paper);border-width:0 2px 2px 0;transform:rotate(45deg)}
.editor .ck[data-done="1"]{color:var(--sec)}
.editor .ck.tagged{padding-left:42px}
.editor .ck.tagged::before{left:12px}
.editor .ck.tagged[data-done="1"]::after{left:19px}
.editor .rt{background:color-mix(in srgb,var(--tc) 18%,transparent);border-bottom:2px solid var(--tc);border-radius:3px}
.editor [data-rtl]::after{content:attr(data-rtl);font-size:12px;font-weight:600;color:var(--tc);margin-left:5px;-webkit-user-select:none;user-select:none;pointer-events:none}
.editor [data-rt]:not(.rt){background:color-mix(in srgb,var(--tc) 9%,transparent);box-shadow:inset 3px 0 0 var(--tc);padding-left:10px;margin-left:-13px}
.editor .flash{animation:flash 1.6s ease}
@keyframes flash{0%,40%{background:color-mix(in srgb,var(--accent) 35%,transparent)}100%{background:transparent}}
.editor:empty::before{content:"書きなぐる…";color:var(--ter)}

.ktbar{position:fixed;left:0;right:0;bottom:0;z-index:25;display:none;align-items:center;justify-content:space-around;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));background:var(--navpaper);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border-top:.5px solid var(--sep)}
.ktbar.on{display:flex}
.ktbar.kb{padding-bottom:6px}
.ktbar button{color:var(--accent);min-width:40px;min-height:36px;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:16px;border-radius:8px}
.ktbar button.on{background:var(--fill)}
.panel{position:fixed;left:8px;right:8px;z-index:26;background:var(--cell);border-radius:14px;box-shadow:0 8px 30px rgba(0,0,0,.25);padding:12px;display:none}
.panel.on{display:block}
.panel .ttl{display:flex;justify-content:space-between;align-items:center;font-weight:600;margin-bottom:10px}
.panel .styles{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
.panel .styles button{flex:none;padding:6px 12px;border-radius:8px;background:var(--fill)}
.panel .styles .s-title{font-weight:700;font-size:20px}
.panel .styles .s-h{font-weight:700}
.panel .styles .s-sh{font-weight:600;font-size:15px}
.panel .styles .s-mono{font-family:var(--mono);font-size:14px}
.panel .rowbtns{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:6px}
.panel .rowbtns button{background:var(--fill);border-radius:8px;height:40px;display:flex;align-items:center;justify-content:center}
.panel .tagpick{display:flex;flex-wrap:wrap;gap:8px;max-height:30vh;overflow-y:auto}
.panel .newtag{display:flex;gap:6px;margin-top:10px}
.panel .newtag input{flex:1;min-width:0;border:0;background:var(--fill);border-radius:8px;padding:8px 10px;font-size:16px}
.panel .newtag button{color:var(--accent);font-weight:600;padding:0 8px}

/* sheets & dialogs */
.overlay{position:fixed;inset:0;z-index:50;background:var(--dim);display:flex;flex-direction:column;justify-content:flex-end;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));animation:fade .2s}
.overlay.center{justify-content:center;align-items:center;padding:24px}
@keyframes fade{from{opacity:0}}
.sheet{display:grid;gap:8px;animation:up .25s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet .grp{background:var(--cell);border-radius:14px;overflow:hidden}
.sheet .msg{padding:14px 16px;text-align:center;color:var(--sec);font-size:13px;border-bottom:.5px solid var(--sep)}
.sheet .grp button{display:block;width:100%;padding:16px;color:var(--blue);font-size:19px;text-align:center}
.sheet .grp button + button{border-top:.5px solid var(--sep)}
.sheet .grp button.danger{color:var(--danger)}
.sheet .cancel{font-weight:600}
.dialog{background:var(--cell);border-radius:14px;width:min(300px,100%);overflow:hidden;text-align:center;animation:pop .2s}
@keyframes pop{from{transform:scale(1.1);opacity:0}}
.dialog h3{margin:18px 16px 4px;font-size:17px}
.dialog p{margin:0 16px 12px;font-size:13px;color:var(--sec)}
.dialog input{width:calc(100% - 32px);margin:0 16px 16px;border:.5px solid var(--sep);border-radius:8px;padding:8px;background:var(--paper);font-size:16px}
.dialog .btns{display:flex;border-top:.5px solid var(--sep)}
.dialog .btns button{flex:1;padding:12px;color:var(--blue);font-size:17px}
.dialog .btns button + button{border-left:.5px solid var(--sep);font-weight:600}
.swatches{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:4px 20px 18px}
.swatches button{aspect-ratio:1;border-radius:50%;background:var(--tc);max-width:100%}
.swatches button[aria-pressed="true"]{box-shadow:0 0 0 3px var(--cell),0 0 0 5px var(--tc)}

.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 56px);transform:translate(-50%,-10px);z-index:60;background:var(--label);color:var(--paper);padding:8px 16px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:.2s;max-width:calc(100% - 32px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="imgpick" accept="image/*" hidden>
<input type="file" id="importpick" accept="application/json,.json" hidden>

<script>
"use strict";
/* =========================================================
   メモ+ — iPhone純正メモの使い勝手 + 行ごとのタグ分類
   ========================================================= */

// ---------- icons ----------
const I = {
  back:'<svg viewBox="0 0 12 21" width="12" height="21"><path d="M10.5 1.5 2 10.5l8.5 9" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  chev:'<svg viewBox="0 0 8 14" width="8" height="14"><path d="M1.5 1.5 6.5 7l-5 5.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  compose:'<svg viewBox="0 0 26 26" width="26" height="26"><path d="M12 4.5H7A2.5 2.5 0 0 0 4.5 7v12A2.5 2.5 0 0 0 7 21.5h12a2.5 2.5 0 0 0 2.5-2.5v-5" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/><path d="M19.6 3.4a2.1 2.1 0 0 1 3 3l-9.3 9.3-4 1 1-4z" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/></svg>',
  folderPlus:'<svg viewBox="0 0 28 24" width="28" height="24"><path d="M2.5 6.5a2 2 0 0 1 2-2h6l2.2 2.5h10.8a2 2 0 0 1 2 2v10.5a2 2 0 0 1-2 2h-19a2 2 0 0 1-2-2z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M14 10.5v7M10.5 14h7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>',
  folder:'<svg viewBox="0 0 26 22" width="24" height="20"><path d="M2 5.5a2 2 0 0 1 2-2h6l2.2 2.5H22a2 2 0 0 1 2 2V17a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>',
  allnotes:'<svg viewBox="0 0 26 22" width="24" height="20"><path d="M2 5.5a2 2 0 0 1 2-2h6l2.2 2.5H22a2 2 0 0 1 2 2V17a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M7 11.5h12M7 15h8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>',
  cal:'<svg viewBox="0 0 24 24" width="22" height="22"><rect x="3" y="4.5" width="18" height="16" rx="3" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="12" cy="15" r="2" fill="currentColor"/></svg>',

// ---------- tiny DOM helper ----------
function h(tag, props, ...kids){
  const e = document.createElement(tag);
  if (props) for (const k in props){
    const v = props[k];
    if (v == null || v === false) continue;
    if (k === "class") e.className = v;
    else if (k === "html") e.innerHTML = v;
    else if (k === "style") e.style.cssText = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (k.startsWith("--")) e.style.setProperty(k, v);
    else e.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) e.append(c.nodeType ? c : document.createTextNode(c));
  return e;
}

// ---------- storage (IndexedDB) ----------
const idb = {
  db: null,
  open(){
    return new Promise((res, rej) => {
      const r = indexedDB.open("memo-plus", 1);
      r.onupgradeneeded = () => { for (const s of ["notes","folders","meta"]) if (!r.result.objectStoreNames.contains(s)) r.result.createObjectStore(s, {keyPath:"id"}); };
      r.onsuccess = () => { this.db = r.result; res(); };
      r.onerror = () => rej(r.error);
    });
  },
  tx(store, mode, fn){
    if (!this.db) return Promise.resolve(mode === "readonly" ? [] : undefined);
    return new Promise((res, rej) => {
      const t = this.db.transaction(store, mode); const os = t.objectStore(store);
      const req = fn(os); t.oncomplete = () => res(req && req.result); t.onerror = () => rej(t.error);
    });
  },
  all(s){ return this.tx(s, "readonly", os => os.getAll()); },
  put(s, v){ return this.tx(s, "readwrite", os => os.put(v)); },
  del(s, id){ return this.tx(s, "readwrite", os => os.delete(id)); },
};

const TAG_RE = /[#＃]([^\s#＃.,、。!！?？()（）「」『』\[\]【】]+)/g;
const PALETTE = 8;
const PRIV = "個人情報";

function noteById(id){ return S.notes.find(n => n.id === id); }

function tagColor(tag){
  if (tag === PRIV && S.tagColors[tag] == null) return "var(--danger)";
  if (S.tagColors[tag] != null) return "var(--h" + S.tagColors[tag] + ")";
  let x = 0; for (const ch of tag) x = (x * 31 + ch.codePointAt(0)) >>> 0;
  return "var(--h" + (x % 7) + ")";
}
function tagIndex(tag){
  if (S.tagColors[tag] != null) return S.tagColors[tag];
  let x = 0; for (const ch of tag) x = (x * 31 + ch.codePointAt(0)) >>> 0; return x % 7;
}
function allTags(){
  const m = new Map();
  for (const n of liveNotes()) for (const l of n.lines || []) for (const t of l.tags){
    const e = m.get(t) || {tag:t, lines:0, last:0}; e.lines++; e.last = Math.max(e.last, l.t || n.updatedAt); m.set(t, e);
  }
  return [...m.values()].sort((a, b) => b.last - a.last);
}

// ---------- note text analysis ----------
function blocksOf(root){
  const out = [];
  for (const n of root.childNodes){
    if (n.nodeType === 3){ if (n.textContent.trim()) out.push(n); }
    else if (n.nodeName === "UL" || n.nodeName === "OL"){ for (const li of n.children) out.push(li); }
    else if (n.nodeType === 1) out.push(n);
  }
  return out;
}
function tagsIn(text){ const t = []; for (const m of text.matchAll(TAG_RE)) if (!t.includes(m[1])) t.push(m[1]); return t; }
function stripTags(text){ return text.replace(TAG_RE, "").replace(/[ \t　 ]+/g, " ").trim(); }
function rtOf(el){ return el && el.nodeType === 1 && el.dataset.rt ? el.dataset.rt.split(" ").filter(Boolean) : []; }
// text with #個人情報 parts removed — this is what gets copied / sent to AI
function pubText(b){
  if (b.nodeType === 3) return tagsIn(b.textContent).includes(PRIV) ? "" : b.textContent.trim();
  const tags = [...tagsIn(b.textContent || ""), ...rtOf(b)];
  if (tags.includes(PRIV)) return "";
  const c = b.cloneNode(true);
  for (const sp of c.querySelectorAll(".rt[data-rt]")) if (rtOf(sp).includes(PRIV)) sp.remove();
  return (c.textContent || "").replace(/\u200b/g, "").replace(/[ \t\u3000\u00a0]{2,}/g, " ").trim();
}
function derive(note){
  const box = document.createElement("div"); box.innerHTML = note.html || "";
  const blocks = blocksOf(box);
  const texts = []; const lines = []; const groups = new Map();
  const hasImg = !!box.querySelector("img");
  const fallbackT = note.updatedAt || note.createdAt;
  blocks.forEach((b, i) => {
    const el = b.nodeType === 1 ? b : null;
    const text = (b.textContent || "").replace(/\u200b/g, "").trim();
    const t = (el && +el.dataset.t) || fallbackT;
    const pub = pubText(b);
    if (text) texts.push(text);
    // inline range tags
    if (el) for (const sp of el.querySelectorAll(".rt[data-rt]")){
      const st = sp.textContent.trim(); if (!st) continue;
      const e = {t, text: st, tags: rtOf(sp), i, inline: true};
      if (e.tags.includes(PRIV)) e.pub = "";
      lines.push(e);
    }
    const tags = [...new Set([...tagsIn(text), ...rtOf(el)])];
    if (!tags.length || !text) return;
    const g = el && el.dataset.g;
    if (g && groups.has(g)){
      const e = groups.get(g); e.pub = [e.pub ?? e.text, pub].filter(Boolean).join("\n"); e.text += "\n" + text;
      for (const x of tags) if (x !== PRIV && !e.tags.includes(x)) e.tags.push(x);
      return;
    }
    const e = {t, text, tags, i, done: !!(el && el.dataset.done === "1")};
    if (pub !== text) e.pub = pub;
    lines.push(e); if (g) groups.set(g, e);
  });
  for (const e of lines) if (e.pub === e.text) delete e.pub;
  note.title = texts[0] ? (stripTags(texts[0]) || texts[0]) : (hasImg ? "画像" : "新規メモ");
  note.preview = texts.slice(1).map(stripTags).join(" ").slice(0, 120) || (hasImg ? "画像" : "追加テキストなし");
  note.lines = lines;
  note.tags = [...new Set(lines.flatMap(l => l.tags))];
  note.empty = !texts.length && !hasImg;
  return note;
}
// nothing left once the private parts are removed → never copied or sent
function isPriv(l){ return !(l.pub ?? l.text).trim(); }

// ---------- dates ----------
const WD = ["日","月","火","水","木","金","土"];
function startOfDay(t){ const d = new Date(t); d.setHours(0,0,0,0); return d.getTime(); }
function hm(t){ const d = new Date(t); return d.getHours() + ":" + String(d.getMinutes()).padStart(2,"0"); }
function shortDate(t){
  const d = new Date(t), today = startOfDay(Date.now()), day = startOfDay(t);
  if (day === today) return hm(t);
  if (today - day === 864e5) return "昨日";
  if (today - day < 7 * 864e5) return WD[d.getDay()] + "曜日";
  return d.getFullYear() + "/" + (d.getMonth()+1) + "/" + d.getDate();
}
function longDate(t){ const d = new Date(t); return d.getFullYear()+"年"+(d.getMonth()+1)+"月"+d.getDate()+"日 "+hm(t); }
function dayTitle(t){
  const d = new Date(t), today = startOfDay(Date.now()), day = startOfDay(t);
  const s = (d.getMonth()+1)+"月"+d.getDate()+"日（"+WD[d.getDay()]+"）";
  if (day === today) return "今日 · " + s;
  if (today - day === 864e5) return "昨日 · " + s;
  return (d.getFullYear() !== new Date().getFullYear() ? d.getFullYear()+"年" : "") + s;
}
function bucket(t){
  const today = startOfDay(Date.now()), day = startOfDay(t), diff = (today - day) / 864e5;
  if (diff < 1) return "今日";
  if (diff < 2) return "昨日";
  if (diff < 7) return "過去7日間";
  if (diff < 30) return "過去30日間";
  const d = new Date(t);
  return d.getFullYear() === new Date().getFullYear() ? (d.getMonth()+1) + "月" : d.getFullYear() + "年";
}
function dayKey(t){ const d = new Date(t); return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate(); }

// ---------- navigation stack ----------
const stack = [];
function push(make, animate = true){
  const scr = make();
  const prev = stack[stack.length - 1];
  stack.push(scr);
  $("#app").append(scr.el);
  if (animate && prev){
    scr.el.classList.add("enter");
    scr.el.getBoundingClientRect();
    requestAnimationFrame(() => { scr.el.classList.remove("enter"); prev.el.classList.add("under"); });
  } else if (prev) prev.el.classList.add("under");
  scr.onShow && scr.onShow();
  return scr;
}
function pop(){
  if (stack.length < 2) return;
  const cur = stack.pop(); const prev = stack[stack.length - 1];
  cur.onLeave && cur.onLeave();
  cur.el.classList.remove("dragging"); prev.el.classList.remove("dragging");
  cur.el.style.transform = ""; prev.el.style.transform = ""; prev.el.style.filter = "";
  cur.el.classList.add("enter"); prev.el.classList.remove("under");
  setTimeout(() => cur.el.remove(), 400);
  prev.refresh && prev.refresh();
}

// edge-swipe back
(function(){
  let sx = 0, sy = 0, on = false, cur, prev;
  document.addEventListener("touchstart", e => {
    const t = e.touches[0];
    if (stack.length < 2 || t.clientX > 24) return;
    on = true; sx = t.clientX; sy = t.clientY; cur = stack[stack.length-1].el; prev = stack[stack.length-2].el;
    cur.classList.add("dragging"); prev.classList.add("dragging");
  }, {passive:true});
  document.addEventListener("touchmove", e => {
    if (!on) return;
    const dx = Math.max(0, e.touches[0].clientX - sx);
    cur.style.transform = "translateX(" + dx + "px)";
    prev.style.transform = "translateX(" + (-28 + dx / innerWidth * 28) + "%)";
  }, {passive:true});
  document.addEventListener("touchend", e => {
    if (!on) return; on = false;
    const dx = e.changedTouches[0].clientX - sx;
    cur.classList.remove("dragging"); prev.classList.remove("dragging");
    if (dx > innerWidth * 0.3) pop();
    else { cur.style.transform = ""; prev.style.transform = ""; }
  });
})();

let openSwipe = null;
function noteRow(n, {showFolder = false, trash = false, onChange} = {}){
  const acts = trash
    ? [ {cls:"a-restore", icon:I.restoreL, label:"復元", fn: async () => { await restoreNote(n); onChange && onChange(); }},
        {cls:"a-del", icon:I.trashL, label:"削除", fn: async () => { if (await confirmBox("完全に削除しますか？", "この操作は取り消せません。", "削除")){ await purgeNote(n); onChange && onChange(); } }} ]
    : [ {cls:"a-pin", icon:I.pinL, label: n.pinned ? "固定解除" : "固定", fn: async () => { n.pinned = !n.pinned; await idb.put("notes", n); onChange && onChange(); }},
        {cls:"a-move", icon:I.moveL, label:"移動", fn: async () => { if (await moveNote(n)) onChange && onChange(); }},
        {cls:"a-del", icon:I.trashL, label:"削除", fn: async () => { await trashNote(n); onChange && onChange(); }} ];
  const W = acts.length * 72;
  const inner = h("button", {class:"nrow"},
    h("div", {class:"tt"}, n.pinned && !trash ? h("span", {class:"pinic", html:I.pin}) : null, h("span", null, n.title)),
    h("div", {class:"sub"}, h("span", {class:"d"}, shortDate(n.updatedAt)), h("span", {class:"p"}, n.preview)),
    showFolder || trash ? h("div", {class:"fold"}, h("span", {html:I.folder, style:"transform:scale(.6);margin:-4px"}), trash ? "残り" + Math.max(0, 30 - Math.floor((Date.now() - n.deletedAt) / 864e5)) + "日" : folderName(n.folderId)) : null,
    n.tags && n.tags.length ? h("div", {class:"dots"}, n.tags.slice(0, 6).map(t => chip(t, {sm:true, button:false}))) : null);
  const wrap = h("div", {class:"swipe"},
    h("div", {class:"acts"}, acts.map(a => h("button", {class:a.cls, onclick: e => { e.stopPropagation(); close(); a.fn(); }}, h("span", {html:a.icon}), a.label))),
    inner);
  let x0 = 0, y0 = 0, dx = 0, mode = null, isOpen = false;
  function close(){ inner.style.transform = ""; isOpen = false; if (openSwipe === close) openSwipe = null; }
  inner.addEventListener("touchstart", e => {
    if (openSwipe && openSwipe !== close) openSwipe();
    x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; mode = null; dx = 0;
  }, {passive:true});
  inner.addEventListener("touchmove", e => {
    const mx = e.touches[0].clientX - x0, my = e.touches[0].clientY - y0;
    if (!mode) mode = Math.abs(mx) > Math.abs(my) + 4 && x0 > 30 ? "x" : (Math.abs(my) > 6 ? "y" : null);
    if (mode !== "x") return;
    dx = Math.min(0, Math.max(-W - 30, (isOpen ? -W : 0) + mx));
    inner.classList.add("drag"); inner.style.transform = "translateX(" + dx + "px)";
  }, {passive:true});
  inner.addEventListener("touchend", () => {
    inner.classList.remove("drag");

    if (dx < -W / 2){ inner.style.transform = "translateX(" + (-W) + "px)"; isOpen = true; openSwipe = close; }
    else close();
  });
  inner.addEventListener("click", async () => {
    if (mode === "x" || isOpen){ if (isOpen) close(); return; }
    if (trash){
      const a = await sheet("「最近削除した項目」のメモは、復元するまで編集できません。", [{label:"復元", value:"r"}, {label:"完全に削除", value:"d", danger:true}]);

      return;
    }
    push(() => EditorScreen(n.id));
  });
  return wrap;
}

async function sendToAI(tag, entries){
  const skip = entries.filter(isPriv);
  const ok = entries.filter(l => !isPriv(l)).sort((a, b) => a.t - b.t);
  if (!ok.length){ toast("選んだ行はすべて個人情報なので、コピー・送信できません"); return; }
  const md = t => { const d = new Date(t); return (d.getMonth()+1) + "/" + d.getDate(); };
  const body = ok.map(l => "- (" + md(l.t) + ") " + stripTags(l.pub ?? l.text).replace(/\n/g, "\n  ")).join("\n");
  const prompt = "以下は私のメモのうち「#" + tag + "」に分類した" + ok.length + "件です。\n" +
    "重複している内容は1つにまとめ、似た話題ごとに見出しを付けて、見やすく整理してください。情報は削らず、食い違いがあれば指摘してください。\n\n" + body;
  const partial = ok.filter(l => l.pub != null).length;
  const msg = (skip.length ? "#個人情報 の" + skip.length + "件は抜きました。" : "") +
    (partial ? "一部に個人情報がある" + partial + "件は、その部分だけ抜きました。" : "") +
    ok.length + "件を整理の指示と一緒に送ります。";
  const a = await sheet(msg, [
    {label:"Claudeで整理する", value:"claude"},
    {label:"ほかのAIアプリに送る", value:"share"},
    {label:"コピーする", value:"copy"}]);
  if (!a) return;
  const copy = async () => { try { await navigator.clipboard.writeText(prompt); return true; } catch(e){ return false; } };
  if (a === "copy"){ toast(await copy() ? "コピーしました。AIに貼り付けてください" : "コピーできませんでした"); return; }
  if (a === "share"){
    if (navigator.share){ try { await navigator.share({text: prompt}); } catch(e){} }
    else toast(await copy() ? "コピーしました。AIに貼り付けてください" : "共有できませんでした");
    return;
  }
  const q = encodeURIComponent(prompt);
  const win = window.open(q.length < 6000 ? "https://claude.ai/new?q=" + q : "https://claude.ai/new", "_blank");
  const copied = await copy();
  if (q.length >= 6000) toast(copied ? "長いのでコピーしました。Claudeに貼り付けてください" : "長すぎて送れませんでした。行を減らしてください");
  else if (!win) toast(copied ? "コピーしました。Claudeを開いて貼り付けてください" : "Claudeを開けませんでした");
}

  const fmt = h("div", {class:"panel"});
  const tagp = h("div", {class:"panel"});
  el.append(when, ed, kbar, fmt, tagp);
  function pd(e){ e.preventDefault(); }

  // --- selection helpers
  let savedRange = null;
  function keepRange(){ const s = getSelection(); if (s.rangeCount && ed.contains(s.anchorNode)) savedRange = s.getRangeAt(0).cloneRange(); }
  function restoreRange(){ if (!savedRange) return; ed.focus(); const s = getSelection(); s.removeAllRanges(); s.addRange(savedRange); }
  function caretBlock(){
    const s = getSelection(); if (!s.rangeCount) return null;
    let n = s.anchorNode; if (!n || !ed.contains(n)) return null;
    while (n && n.parentNode !== ed && !(n.nodeName === "LI" && n.parentNode.parentNode === ed)) n = n.parentNode;
    if (n && n.nodeType === 3){ const d = document.createElement("div"); n.replaceWith(d); d.append(n); placeCaret(n, s.anchorOffset); return d; }
    return n;
  }
  function placeCaret(node, off){ const r = document.createRange(); r.setStart(node, Math.min(off, node.length ?? node.childNodes.length)); r.collapse(true); const s = getSelection(); s.removeAllRanges(); s.addRange(r); }

  function wrapTags(block, allowEnd){
    if (!block || block.nodeType !== 1) return;
    const s = getSelection(); const an = s.anchorNode, ao = s.anchorOffset;
    const walker = document.createTreeWalker(block, NodeFilter.SHOW_TEXT, {acceptNode: n => n.parentNode.closest(".tag") ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT});
    const nodes = []; while (walker.nextNode()) nodes.push(walker.currentNode);
    for (const tn of nodes){
      let node = tn;
      const re = new RegExp(TAG_RE.source, "g");
      let m;
      while ((m = re.exec(node.data))){
        const end = m.index + m[0].length;
        const after = node.data[end];
        if (after === undefined && !allowEnd) break;
        if (after !== undefined && !/[\s　 .,、。!！?？()（）「」『』\[\]【】]/.test(after)) continue;
        const tagNode = node.splitText(m.index); const rest = tagNode.splitText(m[0].length);
        const span = h("span", {class:"tag", "--tc": tagColor(m[1])}); tagNode.replaceWith(span); span.append(tagNode);
        if (an === node && ao >= end) placeCaret(rest, ao - end);
        else if (an === node && ao > m.index) placeCaret(tagNode, ao - m.index);
        node = rest; re.lastIndex = 0;
      }
    }
  }
  function unwrapBadTags(){
    for (const sp of ed.querySelectorAll(".tag")){
      const t = sp.textContent;
      if (!/^[#＃][^\s#＃]+$/.test(t)) sp.replaceWith(document.createTextNode(t));
      else sp.style.setProperty("--tc", tagColor(t.slice(1)));
    }
  }
  function decorate(){
    for (const el of ed.querySelectorAll("[data-rt]")){ const l = rtOf(el); if (l.length) el.style.setProperty("--tc", tagColor(l[0])); }
    for (const b of blocksOf(ed)){
      if (b.nodeType !== 1) continue;
      const tags = tagsIn(b.textContent || "");
      if (tags.length){ b.classList.add("tagged"); b.style.setProperty("--tc", tagColor(tags[0])); }
      else if (b.classList.contains("tagged")){ b.classList.remove("tagged"); if (!b.dataset.rt) b.style.removeProperty("--tc"); if (!b.getAttribute("class")) b.removeAttribute("class"); if (!b.getAttribute("style")) b.removeAttribute("style"); }
    }
  }

  // --- save
  let saveT = null, dirty = false;
  function scheduleSave(){ dirty = true; clearTimeout(saveT); saveT = setTimeout(saveNow, 500); }
  async function saveNow(){
    clearTimeout(saveT); if (!dirty) return; dirty = false;
    decorate();
    note.html = ed.innerHTML; note.updatedAt = Date.now();
    await saveNote(note);
    when.textContent = longDate(note.updatedAt);
    setNavTitle(nav, note.title);
  }

  // --- input handling
  ed.addEventListener("beforeinput", e => {
    if (e.inputType === "insertParagraph"){
      const b = caretBlock();
      if (b && b.classList && b.classList.contains("ck") && !b.textContent.trim()){
        e.preventDefault(); b.classList.remove("ck"); b.removeAttribute("data-done"); scheduleSave(); return;
      }
      if (b) wrapTags(b, true);
      // caret at the very end of a tag chip: step outside it so the new line isn't born inside the chip
      const s = getSelection();
      if (s.isCollapsed && s.anchorNode){
        const base = s.anchorNode.nodeType === 1 ? s.anchorNode : s.anchorNode.parentNode;
        const sp = base && base.closest && base.closest(".tag,.rt");
        if (sp && ed.contains(sp)){
          const r = document.createRange(); r.selectNodeContents(sp); r.setStart(s.anchorNode, s.anchorOffset);
          if (!r.toString()){ const nr = document.createRange(); nr.setStartAfter(sp); nr.collapse(true); s.removeAllRanges(); s.addRange(nr); }
        }
      }
    }
  });
  ed.addEventListener("input", e => {
    const b = caretBlock();
    if (b && b.nodeType === 1){
      if (e.inputType === "insertParagraph"){
        b.dataset.t = Date.now();
        if (b.classList.contains("ck")) b.dataset.done = "0";
        b.classList.remove("tagged");
        let fixed = false;
        b.querySelectorAll(".tag,.rt").forEach(sp => { if (!sp.textContent){ sp.replaceWith(...sp.childNodes); fixed = true; } });
        if (!b.textContent.trim()){ for (const k of ["rt","rtl","g"]) delete b.dataset[k]; b.style.removeProperty("--tc"); }
        if (!b.firstChild){ b.append(document.createElement("br")); fixed = true; }
        if (fixed) placeCaret(b, 0);
      } else if (!b.dataset.t) b.dataset.t = Date.now();
      if (e.inputType === "insertText" && e.data && /[\s　.,、。!！?？]/.test(e.data.slice(-1)) && !e.isComposing) wrapTags(b, false);
    }
    scheduleSave();
  });
  ed.addEventListener("compositionend", () => { const b = caretBlock(); if (b) wrapTags(b, false); scheduleSave(); });
  ed.addEventListener("click", e => {
    const ck = e.target.closest && e.target.closest(".ck");
    if (ck){
      const left = ck.getBoundingClientRect().left + (ck.classList.contains("tagged") ? 10 : 0);
      if (e.clientX - left < 30){ ck.dataset.done = ck.dataset.done === "1" ? "0" : "1"; scheduleSave(); e.preventDefault(); }
    }
    const tg = e.target.closest && e.target.closest(".tag");
    if (tg && document.activeElement !== ed) openTag(tg.textContent.slice(1));
  });
  ed.addEventListener("focus", () => { kbar.classList.add("on"); doneBtn.style.display = ""; shareBtn.style.display = "none"; moreBtn.style.display = "none"; placeBars(); });
  ed.addEventListener("blur", () => {
    setTimeout(() => {
      if (document.activeElement === ed || el.contains(document.activeElement)) return;
      kbar.classList.remove("on"); fmt.classList.remove("on"); tagp.classList.remove("on"); kAa.classList.remove("on"); kTag.classList.remove("on");
      doneBtn.style.display = "none"; shareBtn.style.display = ""; moreBtn.style.display = "";
      blocksOf(ed).forEach(b => wrapTags(b, true)); unwrapBadTags(); dirty = true; saveNow();
    }, 120);
  });
  document.addEventListener("selectionchange", keepRange);

  // keep toolbars above the on-screen keyboard
  function placeBars(){
    const vv = window.visualViewport; let off = 0;
    if (vv) off = Math.max(0, innerHeight - vv.height - vv.offsetTop);
    kbar.style.bottom = off + "px"; kbar.classList.toggle("kb", off > 0);
    const kb = kbar.getBoundingClientRect().height;
    fmt.style.bottom = tagp.style.bottom = (off + kb + 8) + "px";
  }
  window.visualViewport && visualViewport.addEventListener("resize", placeBars);
  window.visualViewport && visualViewport.addEventListener("scroll", placeBars);

  // --- format panel
  const cmd = (c, v) => { restoreRange(); document.execCommand(c, false, v); scheduleSave(); keepRange(); };
  function block(tagName){ restoreRange(); document.execCommand("formatBlock", false, tagName); const b = caretBlock(); if (b && b.nodeType === 1) b.dataset.t = b.dataset.t || Date.now(); scheduleSave(); }
  fmt.append(
    h("div", {class:"ttl"}, h("span", null, "書式"), h("button", {class:"navbtn", onmousedown: pd, onclick: () => { fmt.classList.remove("on"); kAa.classList.remove("on"); }}, "閉じる")),
    h("div", {class:"styles"},
      h("button", {class:"s-title", onmousedown: pd, onclick: () => block("h1")}, "タイトル"),
      h("button", {class:"s-h", onmousedown: pd, onclick: () => block("h2")}, "見出し"),
      h("button", {class:"s-sh", onmousedown: pd, onclick: () => block("h3")}, "小見出し"),
      h("button", {onmousedown: pd, onclick: () => block("div")}, "本文"),
      h("button", {class:"s-mono", onmousedown: pd, onclick: () => block("pre")}, "等幅")),
    h("div", {class:"rowbtns"},
      h("button", {onmousedown: pd, onclick: () => cmd("bold"), style:"font-weight:800"}, "B"),
      h("button", {onmousedown: pd, onclick: () => cmd("italic"), style:"font-style:italic;font-family:Georgia,serif"}, "I"),
      h("button", {onmousedown: pd, onclick: () => cmd("underline"), style:"text-decoration:underline"}, "U"),
      h("button", {onmousedown: pd, onclick: () => cmd("strikeThrough"), style:"text-decoration:line-through"}, "S")),
    h("div", {class:"rowbtns"},
      h("button", {onmousedown: pd, onclick: () => cmd("insertUnorderedList"), html:I.list, "aria-label":"箇条書き"}),
      h("button", {onmousedown: pd, onclick: () => { cmd("insertUnorderedList"); const b = caretBlock(); if (b && b.parentNode && b.parentNode.nodeName === "UL") b.parentNode.classList.add("dash"); }, html:I.dlist, "aria-label":"ダッシュリスト"}),
      h("button", {onmousedown: pd, onclick: () => cmd("insertOrderedList"), html:I.olist, "aria-label":"番号付きリスト"}),
      h("button", {onmousedown: pd, onclick: () => cmd("removeFormat"), style:"font-size:14px"}, "解除")));
  kAa.addEventListener("click", () => { const on = !fmt.classList.contains("on"); fmt.classList.toggle("on", on); kAa.classList.toggle("on", on); tagp.classList.remove("on"); kTag.classList.remove("on"); placeBars(); });
  kList.addEventListener("click", () => cmd("insertUnorderedList"));
  kCk.addEventListener("click", () => {
    restoreRange(); const b = caretBlock();
    if (!b || b.nodeType !== 1 || b.nodeName === "LI"){ toast("リストの外で使ってください"); return; }
    if (b.classList.contains("ck")){ b.classList.remove("ck"); b.removeAttribute("data-done"); }
    else { b.classList.add("ck"); b.dataset.done = "0"; b.dataset.t = b.dataset.t || Date.now(); }
    scheduleSave();
  });

  // --- tag picker
  let rangeMode = false;
  function setRT(el, list){
    if (!list.length){
      for (const k of ["rt","rtl","g"]) delete el.dataset[k];
      el.style.removeProperty("--tc");
      if (el.classList.contains("rt")) el.replaceWith(...el.childNodes);
      return;
    }
    el.dataset.rt = list.join(" "); el.dataset.rtl = list.map(t => "#" + t).join(" ");
    el.style.setProperty("--tc", tagColor(list[0]));
  }
  function applyRangeTag(tag){
    restoreRange();
    const s = getSelection(); if (!s.rangeCount) return;
    const r = s.getRangeAt(0); if (r.collapsed) return;
    const bs = blocksOf(ed).filter(b => b.nodeType === 1 && r.intersectsNode(b));
    if (!bs.length) return;
    const whole = bs.length > 1 || r.toString().trim() === bs[0].textContent.trim();
    if (!whole){
      const span = h("span", {class:"rt"});
      span.append(r.extractContents()); r.insertNode(span); setRT(span, [tag]);
      const nr = document.createRange(); nr.setStartAfter(span); nr.collapse(true); s.removeAllRanges(); s.addRange(nr);
    } else {
      const g = bs.length > 1 ? uid() : null;
      for (const b of bs){
        const l = rtOf(b); if (!l.includes(tag)) l.push(tag); setRT(b, l);
        b.dataset.t = b.dataset.t || Date.now();
        if (g) b.dataset.g = g; else delete b.dataset.g;
      }
      s.collapseToEnd();
    }
    keepRange();
  }
  function caretRT(){
    if (!savedRange) return null;
    let n = savedRange.startContainer; if (n.nodeType !== 1) n = n.parentNode;
    const sp = n && n.closest && n.closest(".rt[data-rt]");
    if (sp && ed.contains(sp)) return sp;
    let b = n; while (b && b.parentNode !== ed && !(b.nodeName === "LI" && b.parentNode.parentNode === ed)) b = b.parentNode;
    return b && b.nodeType === 1 && b !== ed && b.dataset.rt ? b : null;
  }
  function removeRT(el, tag){
    const targets = el.dataset.g ? [...ed.querySelectorAll('[data-g="' + el.dataset.g + '"]')] : [el];
    for (const x of targets) setRT(x, rtOf(x).filter(t => t !== tag));
    tagp.classList.remove("on"); kTag.classList.remove("on");
    scheduleSave(); toast("#" + tag + " を外しました");
  }
  function insertTag(t){
    if (rangeMode){
      applyRangeTag(t);
      tagp.classList.remove("on"); kTag.classList.remove("on");
      scheduleSave(); toast("選択範囲を #" + t + " に分類しました");
      return;
    }
    restoreRange();
    const b = caretBlock();
    const before = b && b.textContent && !/[\s\u3000\u00a0]$/.test(b.textContent) ? " " : "";
    document.execCommand("insertText", false, before + "#" + t + " ");
    const nb = caretBlock(); if (nb && nb.nodeType === 1){ nb.dataset.t = nb.dataset.t || Date.now(); wrapTags(nb, false); }
    tagp.classList.remove("on"); kTag.classList.remove("on");
    scheduleSave(); toast("#" + t + " に分類しました");
  }
  function renderTagPicker(){
    rangeMode = !!(savedRange && !savedRange.collapsed && savedRange.toString().trim());
    const newIn = h("input", {type:"text", placeholder:"新しいタグ名", id:"newtag-" + note.id, enterkeyhint:"done"});
    const add = () => { const v = newIn.value.trim().replace(/^[#＃]/, "").replace(/\s+/g, ""); if (v) insertTag(v); };
    newIn.addEventListener("keydown", e => { if (e.key === "Enter" && !e.isComposing){ e.preventDefault(); add(); } });
    const tags = [PRIV, ...allTags().map(t => t.tag).filter(t => t !== PRIV)];
    const pickChip = t => {
      const c = chip(t, {onclick: () => insertTag(t)}); c.addEventListener("mousedown", pd);
      if (t === PRIV) c.append(h("span", {class:"n"}, "コピー・AIから除外"));
      return c;
    };
    const cur = rangeMode ? null : caretRT();
    tagp.replaceChildren(...[
      h("div", {class:"ttl"}, h("span", null, rangeMode ? "選択範囲にタグを付ける" : "この行にタグを付ける"),
        h("button", {class:"navbtn", onmousedown: pd, onclick: () => { tagp.classList.remove("on"); kTag.classList.remove("on"); }}, "閉じる")),
      cur ? h("div", {class:"sub"}, "付いているタグ（タップで外す）") : null,
      cur ? h("div", {class:"tagpick"}, rtOf(cur).map(t => { const c = chip(t, {onclick: () => removeRT(cur, t)}); c.append(h("span", {class:"x"}, "×")); c.addEventListener("mousedown", pd); return c; })) : null,
      cur ? h("div", {class:"sub"}, "追加する") : null,
      h("div", {class:"tagpick"}, tags.map(pickChip)),
      h("div", {class:"newtag"}, newIn, h("button", {onclick: add}, "追加")),
      !rangeMode && !cur ? h("p", {class:"note", style:"margin:10px 0 0"}, "文字を選択してから # を押すと、選んだ範囲だけにタグを付けられます。") : null].filter(Boolean));
  }
  kTag.addEventListener("click", () => { keepRange(); const on = !tagp.classList.contains("on"); if (on) renderTagPicker(); tagp.classList.toggle("on", on); kTag.classList.toggle("on", on); fmt.classList.remove("on"); kAa.classList.remove("on"); placeBars(); });

  // --- images
  kImg.addEventListener("click", () => { keepRange(); const p = $("#imgpick"); p.value = ""; p.onchange = async () => {
    const f = p.files[0]; if (!f) return;
    try { const url = await shrink(f); restoreRange(); document.execCommand("insertHTML", false, '<div data-t="' + Date.now() + '"><img src="' + url + '" alt=""></div><div data-t="' + Date.now() + '"><br></div>'); scheduleSave(); }
    catch(e){ toast("画像を読み込めませんでした"); }
  }; p.click(); });

  // --- share / more
  function plainText(){ return blocksOf(ed).map(b => b.textContent).join("\n"); }
  async function shareNote(){
    await saveNow();
    if (navigator.share){ try { await navigator.share({title: note.title, text: plainText()}); } catch(e){} return; }
    try { await navigator.clipboard.writeText(plainText()); toast("コピーしました"); } catch(e){ toast("共有できませんでした"); }
  }
  async function moreMenu(){
    await saveNow();
    const a = await sheet(null, [
      {label: note.pinned ? "固定を解除" : "メモを固定", value:"pin"},
      {label:"移動", value:"move"},
      {label:"テキストをコピー", value:"copy"},
      {label:"削除", value:"del", danger:true}]);
    if (a === "pin"){ note.pinned = !note.pinned; await idb.put("notes", note); toast(note.pinned ? "固定しました" : "固定を解除しました"); }
    if (a === "move"){ if (await moveNote(note)) nav.querySelector(".l .navbtn").lastChild.textContent = folderName(note.folderId); }
    if (a === "copy"){ try { await navigator.clipboard.writeText(plainText()); toast("コピーしました"); } catch(e){ toast("コピーできませんでした"); } }
    if (a === "del"){ await trashNote(note); pop(); }
  }

  setNavTitle(nav, note.title);
  return {
    el, label: "メモ",
    onShow(){
      if (opts.focusT || opts.focusI != null){
        const bs = blocksOf(ed);
        const target = bs.find(b => b.dataset && +b.dataset.t === opts.focusT) || bs[opts.focusI];
        if (target && target.nodeType === 1) setTimeout(() => { target.scrollIntoView({block:"center", behavior:"smooth"}); target.classList.add("flash"); setTimeout(() => target.classList.remove("flash"), 1700); }, 380);
      }
      if (opts.focusEnd){
        ed.focus();
        if (opts.appendTag){
          const nb = h("div", {"data-t": Date.now()});
          const sp = h("span", {class:"tag", "--tc": tagColor(opts.appendTag)}, "#" + opts.appendTag);
          const tx = document.createTextNode(" ");
          nb.append(sp, tx);
          const last = ed.lastElementChild;
          if (last && !last.textContent.trim() && !last.querySelector("img")) last.replaceWith(nb); else ed.append(nb);
          placeCaret(tx, 1); scheduleSave();
        } else {
          const bs = blocksOf(ed); const last = bs[bs.length - 1]; if (last) caretToEnd(last);
        }
        setTimeout(() => (ed.lastElementChild || ed).scrollIntoView({block:"center"}), 60);
      }
    },
    onLeave(){
      document.removeEventListener("selectionchange", keepRange);
      window.visualViewport && visualViewport.removeEventListener("resize", placeBars);
      window.visualViewport && visualViewport.removeEventListener("scroll", placeBars);
      if (document.activeElement === ed) ed.blur();
      blocksOf(ed).forEach(b => wrapTags(b, true)); unwrapBadTags(); decorate();
      note.html = ed.innerHTML; derive(note);
      if (note.empty){ purgeNote(note); return; }
      if (dirty) { note.updatedAt = Date.now(); dirty = false; }
      clearTimeout(saveT); saveNote(note);
    }
  };
}

function shrink(file){
  return new Promise((res, rej) => {
    const img = new Image(); const url = URL.createObjectURL(file);
    img.onload = () => {
      const max = 1400, k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas"); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      res(c.toDataURL("image/jpeg", 0.8));
    };
    img.onerror = rej; img.src = url;
  });
}

// ---------- entry points ----------
async function openNewNote(folderId){
  const n = await createNote(folderId, '<div data-t="' + Date.now() + '"><br></div>');
  push(() => EditorScreen(n.id, {focusEnd:true}));
}
async function openToday(opts = {}){
  const key = dayKey(Date.now());
  let n = liveNotes().find(x => x.folderId === SYS.daily && x.dailyKey === key);
  if (!n){
    const d = new Date(), t = Date.now();
    n = await createNote(SYS.daily, '<div data-t="' + t + '">' + d.getFullYear() + "年" + (d.getMonth()+1) + "月" + d.getDate() + "日（" + WD[d.getDay()] + '）</div><div data-t="' + t + '"><br></div>');
    n.dailyKey = key; await idb.put("notes", n);
  }
  push(() => EditorScreen(n.id, {focusEnd:true, appendTag: opts.appendTag}));
}

// ---------- backup ----------
async function exportData(){
  const data = JSON.stringify({app:"memo-plus", version:1, exportedAt:new Date().toISOString(), folders:S.folders, notes:S.notes, tagColors:S.tagColors});
  const name = "memo-plus-" + new Date().toISOString().slice(0,10) + ".json";
  const file = new File([data], name, {type:"application/json"});
  if (navigator.canShare && navigator.canShare({files:[file]})){
    try { await navigator.share({files:[file], title:name}); return; } catch(e){ if (e.name === "AbortError") return; }
  }
  const a = h("a", {href: URL.createObjectURL(file), download: name}); document.body.append(a); a.click(); a.remove();
  toast("書き出しました");
}
$("#importpick").addEventListener("change", async e => {
  const f = e.target.files[0]; e.target.value = ""; if (!f) return;
  try {
    const d = JSON.parse(await f.text());
    if (d.app !== "memo-plus") throw new Error("format");
    if (!await confirmBox("バックアップを読み込みますか？", (d.notes || []).length + "件のメモを追加します。同じメモは上書きされます。", "読み込む")) return;
    for (const fo of d.folders || []){ await idb.put("folders", fo); if (!S.folders.some(x => x.id === fo.id)) S.folders.push(fo); }
    for (const n of d.notes || []){ await idb.put("notes", n); const i = S.notes.findIndex(x => x.id === n.id); i >= 0 ? S.notes[i] = n : S.notes.push(n); }
    Object.assign(S.tagColors, d.tagColors || {}); await saveMeta();
    stack[stack.length - 1].refresh && stack[stack.length - 1].refresh();
    toast("読み込みました");
  } catch(err){ toast("このファイルは読み込めません"); }
});

// ---------- boot ----------
(async function boot(){
  try { await idb.open(); } catch(e){ toast("保存領域を開けませんでした。メモは保存されません"); }
  S.folders = await idb.all("folders");
  S.notes = await idb.all("notes");
  // re-analyse every note on start so rule changes (e.g. what counts as private) apply to old notes too
  for (const n of S.notes) derive(n);
  const meta = await idb.all("meta"); const tc = meta.find(m => m.id === "tagColors"); if (tc) S.tagColors = tc.value || {};
  for (const [id, name] of [[SYS.notes, "メモ"], [SYS.daily, "毎日メモ"]]){
    if (!S.folders.some(f => f.id === id)){ const f = {id, name, system:true, createdAt:0}; S.folders.push(f); await idb.put("folders", f); }
  }
  // purge notes deleted over 30 days ago
  for (const n of S.notes.filter(n => n.deletedAt && Date.now() - n.deletedAt > 30 * 864e5)) await purgeNote(n);
  if (!S.notes.length){
    const t = Date.now();
    await createNote(SYS.notes,
      '<div data-t="' + t + '">メモ+ へようこそ</div>' +
      '<div data-t="' + t + '">純正メモと同じように書けます。行の中に <span class="tag" style="--tc:' + tagColor("使い方") + '">#使い方</span> のようにタグを書くと、その行がジャンルに自動で集まります。</div>' +
      '<div data-t="' + t + '">カレー 玉ねぎは飴色まで炒める <span class="tag" style="--tc:' + tagColor("料理") + '">#料理</span></div>' +
      '<div data-t="' + t + '" class="ck" data-done="0">左の丸をタップするとチェックできます</div>' +
      '<div data-t="' + t + '">フォルダ画面の「今日のメモ」から、日付ごとに書きなぐれます。</div>');
  }
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  const home = push(FoldersScreen, false); home.label = "フォルダ";
})();

if ("serviceWorker" in navigator && location.protocol !== "file:") navigator.serviceWorker.register("sw.js").catch(() => {});
